<!doctype html>

<style>
/* Standard business card, 85 x 55 mm. Page 1 front, page 2 back. */
:root{ --ink:#0B1324; --green:#12B886; --deep:#0A7D5B; --mint:#7FE0BC; --slate:#5B6672; --text:#33404D; --white:#FFFFFF;
  --display:"Space Grotesk", sans-serif; --body:"Inter", system-ui, sans-serif }
@page{ size:85mm 55mm; margin:0 }
*{ box-sizing:border-box; margin:0; padding:0 }
html{ background:#d9dedc }
body{ font-family:var(--body); -webkit-print-color-adjust:exact; print-color-adjust:exact }
.card{ width:85mm; height:55mm; position:relative; overflow:hidden; margin:8mm auto; break-after:page; page-break-after:always }
@media print{ html{ background:none } .card{ margin:0 } }

/* front */
.front{ background:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4.2mm }
.lockup{ display:flex; align-items:baseline; font-family:var(--display); font-size:10.6mm; font-weight:600; letter-spacing:-.05em; line-height:1; color:var(--white) }
.lockup .sym{ width:.92em; height:.92em; margin-right:.26em; position:relative; top:.2em; flex:none }
.lockup .o{ width:.65em; height:.65em; margin:0 -.05em 0 .01em; flex:none }
.tag{ font-size:3.2mm; color:var(--mint); letter-spacing:.01em }

/* back */
.back{ background:var(--white); color:var(--ink); padding:5.6mm 6.2mm; display:flex; flex-direction:column; justify-content:space-between }
.top{ display:flex; justify-content:space-between; align-items:flex-start }
.name{ font-family:var(--display); font-size:5mm; font-weight:600; letter-spacing:-.02em; line-height:1.15 }
.role{ font-size:3.1mm; font-weight:500; color:var(--deep); margin-top:.8mm }
.cert{ font-size:2.75mm; color:var(--slate); margin-top:.5mm }
.back .mark{ width:6.9mm; height:6.9mm; flex:none }
.bottom{ display:flex; justify-content:space-between; align-items:flex-end; gap:3mm }
.lines{ display:flex; flex-direction:column; gap:1.3mm; font-size:2.95mm; color:var(--text); min-width:0 }
.lines div{ display:flex; align-items:center; gap:2mm; white-space:nowrap }
.lines svg{ width:3.4mm; height:3.4mm; flex:none; fill:none; stroke:var(--deep); stroke-width:2; stroke-linecap:round; stroke-linejoin:round }
.lines .web{ font-weight:600; color:var(--ink) }
.qr{ width:13mm; height:13mm; display:block; flex:none; margin-bottom:1.6mm }
.bar{ position:absolute; right:0; bottom:0; width:25.4mm; height:1.6mm; background:var(--green) }
</style>
</head>
